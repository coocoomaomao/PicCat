name: Desktop Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["package.json","electron/**","build/**","scripts/**","index.html","styles.css","app.js",".github/workflows/desktop-build.yml"]
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run dist:win
      - name: Collect installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          Copy-Item $installer.FullName -Destination "release-files/PicCat-Setup-v$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: PicCat-Windows
          path: release-files/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "release-files/PicCat-Setup-v$version.exe"
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "PicCat 图片转换猫 v$version" --notes "Windows x64 安装版。支持 JPG / PNG / WEBP 批量互转、改尺寸、锁比例、质量调节与常用尺寸预设；图片全程在本机处理，不上传。"
          }
